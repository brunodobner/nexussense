# Configuracao DKMS do nexus_sense.
#
# PACKAGE_VERSION deve acompanhar DRIVER_VERSION em src/nexus_sense.c.
# O setup.sh deriva a versao do fonte e reescreve esta linha ao instalar;
# o valor aqui e apenas o padrao para uso manual.
#
# MAKE e so "make" de proposito. O DKMS 3.x reescreve o comando e injeta
# KERNELRELEASE sozinho -- em dkms-3.4.3, /usr/sbin/dkms:1603 faz
#   the_make_command="${make_command/#make/make -j$N KERNELRELEASE=$kernelver}"
# Repetir KERNELRELEASE aqui duplicaria a atribuicao sem ganho.
#
# CLEAN foi deliberadamente omitido: e deprecado no DKMS 3.x
# (/usr/sbin/dkms:98 lista CLEAN entre as obsoletas, :585 emite o aviso).
# O DKMS gerencia a limpeza sozinho.
#
# Tambem omitidas por nao serem lidas pelo dkms: SUPPORTED_KERNELS,
# MINIMUM_KERNEL_VERSION, KERNEL_UAPI_VERSION_REQUIREMENT, BUILD_DATE,
# MAINTAINER, LICENSE.

PACKAGE_NAME="nexus_sense"
PACKAGE_VERSION="25.701"

MAKE[0]="make"

BUILT_MODULE_NAME[0]="nexus_sense"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"

AUTOINSTALL="yes"
