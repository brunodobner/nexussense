# A cada push: as duas suites e o shellcheck.
#
# Roda num container Arch porque e onde o projeto vive: mesmas versoes de
# Python, PySide6 e shellcheck de quem desenvolve, e o pacman que alguns
# testes consultam. A maquina do CI nao e um Nitro, e varios testes de
# shell leem o estado da maquina de casa (sysfs, DKMS, hwdb): la eles tem
# de PULAR, nao falhar -- e so eles. O passo "So pula o que le a maquina"
# cobra as duas coisas.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  suites:
    name: pytest e suite shell
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      # A imagem do Arch e minima, e o que falta nela nao avisa:
      #
      #   base-devel                traz o diffutils. Sem ele nao ha cmp, e
      #                             test-arvore.sh lia "comando nao existe"
      #                             como "as duas licencas diferem".
      #   python-typing_extensions  o pytest-qt o importa e o pacote do Arch
      #                             nao o declara; num container limpo o
      #                             pytest nem chega a coletar.
      #
      # Numa maquina de uso os dois ja vieram por outro caminho.
      - name: Dependencias
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git python python-pytest python-pytest-qt pyside6 \
            python-typing_extensions python-dbus python-tomli-w dbus \
            ttf-dejavu shellcheck desktop-file-utils
          useradd -m ci

      - uses: actions/checkout@v5

      # As suites rodam como usuario comum: root atravessa permissao de
      # arquivo, e os testes que provam uma recusa passariam a reprovar.
      - name: Repositorio nas maos do usuario de teste
        run: chown -R ci:ci .

      - name: pytest
        run: su ci -c 'python -m pytest -q'

      - name: Suite shell, sem root
        run: su ci -c './tests/run-all.sh' | tee "$RUNNER_TEMP/shell-usuario.txt"

      - name: Suite shell, como root
        run: ./tests/run-all.sh | tee "$RUNNER_TEMP/shell-root.txt"

      # As saidas vao para RUNNER_TEMP, nunca para o checkout: test-arvore.sh
      # cobra a raiz do repositorio, e um log ali reprova a suite.
      #
      # Pular e resultado, e tem de aparecer: vai para o resumo do job. E
      # um teste que nao le a maquina de casa nao tem por que pular aqui --
      # se pular, perdeu uma dependencia e a cobertura sumiu calada.
      - name: So pula o que le a maquina de casa
        run: |
          permitidos=" test-arvore.sh test-dkms.sh test-install-drivers.sh test-perfil-bateria.sh test-permissoes.sh test-quirk-anv15-52.sh test-toolchain.sh test-usb-charging.sh "
          cd "$RUNNER_TEMP"
          sed 's/\x1b\[[0-9;]*m//g' shell-usuario.txt shell-root.txt \
            | awk '$1 == "PULOU" { print $2 }' | sort -u > "$RUNNER_TEMP/pulados.txt"
          {
            echo '### Testes de shell que pularam'
            echo
            sed 's/^/- /' pulados.txt
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          while read -r t; do
            case "$permitidos" in
              *" $t "*) ;;
              *) echo "::error::$t pulou e nao esta entre os que leem a maquina de casa"; rc=1 ;;
            esac
          done < pulados.txt
          exit $rc

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      - name: Dependencias
        run: pacman -Syu --noconfirm --needed git shellcheck

      - uses: actions/checkout@v5

      # Erro e aviso reprovam. Info e estilo saem no log e no resumo, sem
      # reprovar: sao sugestao, e o setup.sh tem 49 KB de historia.
      - name: Erros e avisos
        run: |
          shellcheck --version
          mapfile -t alvos < <(find . -name '*.sh' -not -path './.git/*' | sort)
          [ "${#alvos[@]}" -ge 20 ] || { echo "::error::so ${#alvos[@]} scripts achados"; exit 1; }
          shellcheck -f gcc -S warning "${alvos[@]}"

      - name: Info e estilo, sem reprovar
        if: always()
        run: |
          mapfile -t alvos < <(find . -name '*.sh' -not -path './.git/*' | sort)
          shellcheck -f gcc -S style "${alvos[@]}" > "$RUNNER_TEMP/achados.txt" || true
          cd "$RUNNER_TEMP"
          cat achados.txt
          {
            echo '### shellcheck'
            echo
            echo "$(grep -c ': error:' achados.txt) erros, $(grep -c ': warning:' achados.txt) avisos, $(grep -c ': note:' achados.txt) notas de info e estilo"
          } >> "$GITHUB_STEP_SUMMARY"
